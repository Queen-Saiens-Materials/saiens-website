const b2u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const pw = document.getElementById("pw").value;
  const errEl = document.getElementById("err");
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b2u(SALT), iterations:100000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(IV)}, key, b2u(DATA));
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    errEl.textContent = "通行碼錯誤，請再試一次。";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
